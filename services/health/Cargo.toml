[package]
name = "health-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["io-util", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = "1.28.0"
