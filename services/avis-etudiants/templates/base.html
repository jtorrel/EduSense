<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Avis étudiants{% endblock %} · NWS</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #1f4fd6; --accent-ink: #fff; --danger: #b42318; --ok-bg: #e8f5ec; --ok: #146c2e;
    --err-bg: #fdecea; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  header .in { max-width: 960px; margin: 0 auto; padding: .6rem 1rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
  header .brand { font-weight: 700; text-decoration: none; color: var(--ink); margin-right: auto; }
  header nav { display: flex; flex-wrap: wrap; gap: .25rem .9rem; align-items: center; font-size: .95rem; }
  header nav a { text-decoration: none; }
  header .who { color: var(--muted); font-size: .85rem; }
  main { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.45rem; margin: 0 0 1rem; }
  h2 { font-size: 1.1rem; margin: 1.5rem 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .flash { background: var(--ok-bg); color: var(--ok); padding: .7rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; }
  .errors { background: var(--err-bg); color: var(--danger); padding: .7rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; }
  .errors ul { margin: 0; padding-left: 1.2rem; }
  label { display: block; font-weight: 600; margin: .9rem 0 .3rem; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=email], input[type=date], input[type=search], select, textarea {
    width: 100%; font: inherit; padding: .55rem .65rem; border: 1px solid #c9c9c3; border-radius: 8px; background: #fff;
  }
  textarea { min-height: 7rem; resize: vertical; }
  .btn { display: inline-block; font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
  .btn.secondary { background: #fff; color: var(--accent); }
  .btn.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn.link { background: none; border: none; color: var(--accent); padding: 0; font-weight: 400; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 160px; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  .rating { display: flex; gap: .4rem; flex-wrap: wrap; }
  .rating input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rating label { margin: 0; font-weight: 600; min-width: 2.7rem; text-align: center; padding: .5rem .2rem; border: 1px solid #c9c9c3; border-radius: 8px; background: #fff; cursor: pointer; }
  .rating input:checked + label { background: var(--accent); color: #fff; border-color: var(--accent); }
  .rating input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { display: inline-block; font-size: .78rem; font-weight: 600; padding: .1rem .55rem; border-radius: 999px; white-space: nowrap; }
  .badge.ouvert { background: #e6edff; color: #1f4fd6; }
  .badge.en_cours { background: #fff3d6; color: #8a5a00; }
  .badge.ferme { background: #e8f5ec; color: #146c2e; }
  .badge.annule { background: #eeeeea; color: #6b6b66; }
  .badge.new { background: #fdecea; color: #b42318; }
  .stars { color: #d79a00; letter-spacing: .05em; white-space: nowrap; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: .6rem; }
  .list a.item { display: block; padding: .8rem 1rem; color: inherit; text-decoration: none; }
  .list a.item:hover { background: #fafaf8; }
  .item .top { display: flex; justify-content: space-between; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .item .meta { color: var(--muted); font-size: .88rem; margin-top: .2rem; }
  .item .excerpt { margin-top: .35rem; font-size: .93rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; margin: 0; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply { border-left: 4px solid var(--accent); }
  .history { font-size: .88rem; }
  .list.history li { padding: .35rem 0; margin: 0; background: none; border: 0; border-radius: 0; border-bottom: 1px dashed var(--line); }
  table.simple { width: 100%; border-collapse: collapse; }
  table.simple td, table.simple th { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .pager { display: flex; gap: 1rem; justify-content: center; align-items: center; margin-top: 1rem; }
  .login { max-width: 420px; margin: 3rem auto; text-align: center; }
  form.inline { display: inline; }
  @media (max-width: 560px) { dl.facts { grid-template-columns: 1fr; } dl.facts dt { margin-top: .4rem; } }
</style>
</head>
<body>
<header><div class="in">
  <a class="brand" href="/">Avis étudiants</a>
  {% if let Some(n) = nav %}
  <nav>
    <a href="/tickets">Mes tickets</a>
    {% if n.is_admin %}<a href="/admin/tickets">Tous les tickets</a>{% endif %}
    {% if n.is_superadmin %}<a href="/admin/admins">Admins</a>{% endif %}
    <span class="who" title="{{ n.email }}">{{ n.name }}</span>
    <form class="inline" method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ n.csrf }}">
      <button class="btn link" type="submit">Déconnexion</button>
    </form>
  </nav>
  {% endif %}
</div></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
