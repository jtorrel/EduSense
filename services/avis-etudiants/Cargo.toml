[package]
name = "avis-etudiants"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie-private", "form"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
cookie = { version = "0.18.2", features = ["key-expansion"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[features]
# Connexion simulée pour le développement local (sans Google). Jamais activée dans l'image Docker.
dev-login = []
